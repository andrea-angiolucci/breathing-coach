<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Breathing Coach">
<meta name="theme-color" content="#061A2B">
<title>Breathing Coach</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#061A2B; --bg2:#0B2A40; --ink:#EAF4F7; --ink2:#8FB1C2; --line:rgba(234,244,247,.14);
  --accent:#8FE0D2; --danger:#F08A7A;
  --ph-inhale:#8FE0D2; --ph-hold_full:#F2C879; --ph-exhale:#7FB4F0; --ph-hold_empty:#C4A6EA; --ph-warm:#A9D3B5; --ph-static:#79C9F2;
  --font:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:400;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:inherit}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.screen{display:none;min-height:100%;flex-direction:column;padding:20px 20px 28px;max-width:520px;margin:0 auto}
.screen.on{display:flex}
h1{font-size:22px;font-weight:600;margin:8px 0 4px;letter-spacing:-.01em}
h2{font-size:17px;font-weight:600;margin:24px 0 10px}
p{line-height:1.55;margin:0 0 12px;color:var(--ink2);font-size:15px}
p.lead{color:var(--ink);font-size:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pill{font-size:13px;color:var(--ink2);border:1px solid var(--line);border-radius:20px;padding:6px 12px;white-space:nowrap}
.pill.acc{color:var(--accent);border-color:rgba(143,224,210,.4)}
.btn{display:block;width:100%;padding:16px;border-radius:14px;font-size:17px;font-weight:600;text-align:center;background:var(--accent);color:#04131D;margin-top:10px}
.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.google{background:#fff;color:#1f1f1f;display:flex;align-items:center;justify-content:center;gap:10px}
.btn[disabled]{opacity:.45}
.row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);gap:12px}
.row:last-child{border-bottom:0}
.row .lbl{font-size:15px}
.row .lbl small{display:block;color:var(--ink2);font-size:12.5px;margin-top:2px}
.grp{border-left:3px solid var(--c);padding-left:14px;margin-top:6px}
.grp h2{color:var(--c);margin-top:6px}
.grp-warm{--c:var(--ph-warm)}.grp-main{--c:var(--ph-hold_full)}.grp-static{--c:var(--ph-static)}
#s-static-run{padding:0;transition:background .9s ease}
#s-static-run{height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:hidden;padding:0}
#s-static-run .sess{height:100%;min-height:0;padding:10px 20px 10px;cursor:pointer;justify-content:space-between}
#s-static-run .phase{font-size:22px;min-height:0}
#s-static-run .num{font-size:min(28vw,130px);margin:0}
#s-static-run .btn{padding:12px;font-size:16px}
.card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--bg2);border-radius:16px;padding:16px 14px;margin-top:10px;border-left:4px solid var(--c)}
.card .ic{width:40px;height:40px;flex-shrink:0;color:var(--c)}
.card .ic svg{width:40px;height:40px}
.card b{display:block;font-size:17px;font-weight:600}
.card small{display:block;color:var(--ink2);font-size:13px;margin-top:3px}
.card .chev{margin-left:auto;font-size:26px;color:var(--ink2)}
.card:active{transform:scale(.985)}
.mute svg{width:22px;height:22px}
.tab svg{width:22px;height:22px;stroke:currentColor}
#s-welcome,#s-home,#s-static{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(6,26,43,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 10px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:12px;font-size:12px;color:var(--ink2)}
.tab .ic{height:22px;display:flex}
.tab.sel{color:var(--accent);background:rgba(143,224,210,.1)}
.chart{width:100%;height:auto;display:block;background:var(--bg2);border-radius:12px;padding:8px}
.chart text{font-family:var(--font);font-size:10px;fill:var(--ink2)}
.mute{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);font-size:20px;display:flex;align-items:center;justify-content:center}
.sess .mute{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;border-color:rgba(4,19,29,.35)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);font-size:20px;line-height:1}
.stepper .v{min-width:56px;text-align:center;font-variant-numeric:tabular-nums;font-size:17px;font-weight:600}
.stepper .v small{display:block;font-size:11px;color:var(--ink2);font-weight:400}
.note{background:var(--bg2);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;color:var(--ink)}
.sum{font-size:14px;color:var(--ink2);margin:6px 0 2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.chips button{padding:10px 14px;border-radius:12px;border:1px solid var(--line);font-size:15px}
.chips button.sel{border-color:var(--accent);background:rgba(143,224,210,.12);color:var(--accent)}
input.txt{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);font-size:17px}
input.code{letter-spacing:8px;text-align:center;font-size:28px;font-weight:600}
.err{color:var(--danger);font-size:14px;min-height:20px;margin:8px 0}
.ok{color:var(--accent)}
/* session */
#s-session{padding:0;transition:background .9s ease}
.sess{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:24px 20px 24px;text-align:center;min-height:100%}
.sess .phase{font-size:26px;font-weight:600;letter-spacing:-.01em;min-height:36px}
.sess .lungs{font-size:15px;opacity:.85;min-height:22px;margin-top:6px}
.sess .num{font-size:min(44vw,200px);font-weight:300;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.04em;margin:8px 0}
.sess .meta{display:flex;gap:28px;font-size:15px;opacity:.85;font-variant-numeric:tabular-nums}
.sess .meta b{display:block;font-size:22px;font-weight:600}
.sess .btn{max-width:360px}
.bar{height:4px;width:100%;background:rgba(0,0,0,.25);border-radius:2px;overflow:hidden;margin-top:18px}
.bar i{display:block;height:100%;background:rgba(255,255,255,.9);width:0%;transition:width .25s linear}
.dark .sess{color:#04131D}
.dark .bar{background:rgba(0,0,0,.15)}
.dark .bar i{background:rgba(4,19,29,.85)}
/* feedback */
.fb{display:flex;gap:10px;margin:6px 0 14px}
.fb button{flex:1;padding:16px 6px;border-radius:14px;border:1px solid var(--line);font-size:15px}
.fb button span{display:block;font-size:30px;margin-bottom:6px}
.fb button.sel{border-color:var(--accent);background:rgba(143,224,210,.12)}
textarea{width:100%;min-height:84px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);padding:12px;resize:vertical}
/* diag */
pre{background:#031019;color:#BFD6E0;font-size:11.5px;line-height:1.45;padding:12px;border-radius:12px;max-height:50vh;overflow:auto;white-space:pre-wrap;word-break:break-word}
.hist{font-size:14px;padding:12px 0;border-bottom:1px solid var(--line);color:var(--ink2)}
.hist b{color:var(--ink);font-weight:600}
.link{color:var(--accent);text-decoration:underline;background:none;padding:0;font-size:14px}
.tiny{font-size:12.5px;color:var(--ink2)}
.stats{display:flex;gap:10px;margin:8px 0 4px}
.stats div{flex:1;background:var(--bg2);border-radius:12px;padding:12px;text-align:center}
.stats b{display:block;font-size:22px;font-weight:600}
.stats span{font-size:12px;color:var(--ink2)}
@media (prefers-reduced-motion:reduce){#s-session{transition:none}.bar i{transition:none}}
</style>
</head>
<body>

<!-- ===== DISCLAIMER + CONSENSO ===== -->
<section class="screen" id="s-disclaimer">
  <h1 data-i18n="dis_title"></h1>
  <p class="lead" data-i18n="dis_1"></p>
  <p data-i18n="dis_2"></p>
  <p data-i18n="dis_3"></p>
  <p data-i18n="dis_4"></p>
  <p class="tiny" data-i18n="dis_5"></p>
  <div style="flex:1"></div>
  <button class="btn" id="b-accept" data-i18n="dis_accept"></button>
  <p class="tiny" style="text-align:center;margin-top:14px"><button class="link" id="b-have-account" data-i18n="have_account"></button></p>
</section>

<!-- ===== ONBOARDING ===== -->
<section class="screen" id="s-onb">
  <h1 data-i18n="onb_title"></h1>
  <p data-i18n="onb_sub"></p>
  <h2 data-i18n="onb_name"></h2>
  <input class="txt" id="onb-name" autocomplete="given-name">
  <h2 data-i18n="onb_level"></h2>
  <div class="chips" id="onb-level">
    <button data-v="beginner" data-i18n="lv_beginner"></button>
    <button data-v="intermediate" data-i18n="lv_intermediate"></button>
    <button data-v="advanced" data-i18n="lv_advanced"></button>
  </div>
  <h2 data-i18n="onb_goal"></h2>
  <div class="chips" id="onb-goal">
    <button data-v="relax" data-i18n="goal_relax"></button>
    <button data-v="equalization" data-i18n="goal_eq"></button>
    <button data-v="performance" data-i18n="goal_perf"></button>
  </div>
  <h2 data-i18n="onb_weekly"></h2>
  <div class="row" style="border:0"><div class="lbl" data-i18n="onb_weekly_l"></div><div class="stepper" id="onb-weekly"></div></div>
  <div style="flex:1"></div>
  <button class="btn" id="b-onb-done" data-i18n="onb_done"></button>
  <p class="tiny" style="text-align:center;margin-top:14px"><button class="link" id="b-have-account2" data-i18n="have_account"></button></p>
</section>

<!-- ===== WELCOME ===== -->
<section class="screen" id="s-welcome">
  <div class="top">
    <div><h1 id="wl-hi"></h1><div class="sum" id="wl-streak"></div></div>
    <div style="display:flex;gap:8px;align-items:center"><button class="pill" id="b-lang2">EN</button></div>
  </div>
  <div style="margin:10px 0 4px"><button class="pill" id="b-account3" style="width:100%;text-align:left"></button></div>
  <h2 data-i18n="wl_q"></h2>
  <button class="card" id="wl-breath" style="--c:var(--ph-hold_full)"><span class="ic" data-ic="lungs"></span><span><b data-i18n="wl_breath"></b><small id="wl-breath-sub"></small></span><span class="chev">›</span></button>
  <button class="card" id="wl-static" style="--c:var(--ph-static)"><span class="ic" data-ic="timer"></span><span><b data-i18n="wl_static"></b><small id="wl-static-sub"></small></span><span class="chev">›</span></button>
  <div class="note" style="margin-top:18px" id="wl-tip"></div>
  <div style="flex:1"></div>
  <div style="display:flex;justify-content:space-between;margin-top:18px">
    <button class="link" id="b-history2" data-i18n="history"></button>
    <button class="link" id="b-diag2" data-i18n="diag"></button>
  </div>
  <p class="tiny" style="margin-top:12px" id="ver2"></p>
  <nav class="tabs" data-tabs></nav>
</section>

<!-- ===== HOME / SETTINGS ===== -->
<section class="screen" id="s-home">
  <div class="top">
    <div>
      <h1>Breathing Coach</h1>
      <div class="sum" id="proto-name"></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center"><button class="mute" id="b-mute-home"></button><button class="pill" id="b-lang">EN</button></div>
  </div>
  <div style="margin:10px 0 4px"><button class="pill" id="b-account" style="width:100%;text-align:left"></button></div>

  <div class="grp grp-warm"><h2 data-i18n="set_warm"></h2>
  <div class="row"><div class="lbl" data-i18n="set_warm_in"></div><div class="stepper" data-k="warmIn" data-step="1" data-min="2" data-max="20"></div></div>
  <div class="row"><div class="lbl" data-i18n="set_warm_out"></div><div class="stepper" data-k="warmOut" data-step="1" data-min="2" data-max="20"></div></div>
  <div class="row"><div class="lbl" data-i18n="set_warm_n"></div><div class="stepper" data-k="warmReps" data-step="1" data-min="0" data-max="10"></div></div></div>

  <div class="grp grp-main"><h2 data-i18n="set_main"></h2>
  <div class="row"><div class="lbl" data-i18n="set_in"></div><div class="stepper" data-k="inhale" data-step="1" data-min="2" data-max="60"></div></div>
  <div class="row"><div class="lbl" data-i18n="set_hf"></div><div class="stepper" data-k="holdFull" data-step="5" data-min="0" data-max="600"></div></div>
  <div class="row"><div class="lbl" data-i18n="set_out"></div><div class="stepper" data-k="exhale" data-step="1" data-min="2" data-max="60"></div></div>
  <div class="row"><div class="lbl" data-i18n="set_he"></div><div class="stepper" data-k="holdEmpty" data-step="5" data-min="0" data-max="300"></div></div>
  <div class="row"><div class="lbl" data-i18n="set_cycles"></div><div class="stepper" data-k="cycles" data-step="1" data-min="1" data-max="30"></div></div></div>

  <div class="sum" id="sum-total"></div>
  <div class="note" style="margin-top:14px" data-i18n="reminder"></div>

  <button class="btn" id="b-start" data-i18n="start"></button>
  <button class="btn ghost" id="b-testsound" data-i18n="test_sound"></button>

  <div style="display:flex;justify-content:space-between;margin-top:18px">
    <button class="link" id="b-history" data-i18n="history"></button>
    <button class="link" id="b-diag" data-i18n="diag"></button>
  </div>
  <p class="tiny" style="margin-top:22px" id="ver"></p>
  <nav class="tabs" data-tabs></nav>
</section>

<!-- ===== SESSION ===== -->
<section class="screen" id="s-session" style="position:relative">
  <button class="mute" id="b-mute-sess"></button>
  <div class="sess">
    <div>
      <div class="phase" id="ph"></div>
      <div class="lungs" id="lg"></div>
    </div>
    <div class="num" id="num">–</div>
    <div style="width:100%;max-width:360px">
      <div class="meta" style="justify-content:center">
        <div><b id="m-cycle">–</b><span id="m-cycle-l"></span></div>
        <div><b id="m-left">–</b><span id="m-left-l"></span></div>
      </div>
      <div class="bar"><i id="bar"></i></div>
      <button class="btn danger" id="b-stop" style="margin-top:22px" data-i18n="stop"></button>
    </div>
  </div>
</section>

<!-- ===== FEEDBACK ===== -->
<section class="screen" id="s-feedback">
  <h1 id="fb-title"></h1>
  <p id="fb-sub"></p>
  <h2 data-i18n="fb_q"></h2>
  <div class="fb">
    <button data-v="easy"><span>😄</span><span style="font-size:15px" data-i18n="fb_easy"></span></button>
    <button data-v="right"><span>😐</span><span style="font-size:15px" data-i18n="fb_right"></span></button>
    <button data-v="hard"><span>😣</span><span style="font-size:15px" data-i18n="fb_hard"></span></button>
  </div>
  <textarea id="fb-notes"></textarea>
  <div style="flex:1"></div>
  <button class="btn" id="b-save" data-i18n="save"></button>
</section>

<!-- ===== PROSSIMA SESSIONE ===== -->
<section class="screen" id="s-next">
  <h1 data-i18n="nx_title"></h1>
  <p data-i18n="nx_sub"></p>
  <div class="chips" id="nx-mode">
    <button data-v="easier" data-i18n="nx_easier"></button>
    <button data-v="same" data-i18n="nx_same"></button>
    <button data-v="harder" data-i18n="nx_harder"></button>
  </div>
  <div id="nx-steppers"></div>
  <div class="sum" id="nx-total"></div>
  <div style="flex:1"></div>
  <button class="btn" id="b-nx-use" data-i18n="nx_use"></button>
  <button class="btn ghost" id="b-nx-skip" data-i18n="nx_skip"></button>
</section>

<!-- ===== APNEA STATICA: intro / storico ===== -->
<section class="screen" id="s-static">
  <div class="top"><div><h1 data-i18n="st_title"></h1><div class="sum" data-i18n="st_home_sub"></div></div><button class="pill" id="b-account2" style="flex-shrink:0;max-width:42%;overflow:hidden;text-overflow:ellipsis"></button></div>
  <p data-i18n="st_sub"></p>
  <div class="stats"><div><b id="st-pb">–</b><span data-i18n="st_pb"></span></div><div><b id="st-last">–</b><span data-i18n="st_last"></span></div><div><b id="st-count">0</b><span data-i18n="st_tests"></span></div></div>
  <div class="grp grp-static"><h2 data-i18n="st_settings"></h2>
    <div class="row"><div class="lbl" data-i18n="st_warm"><small></small></div><div class="stepper" id="st-warm"></div></div>
    <div class="row"><div class="lbl" data-i18n="st_voice"></div><div style="display:flex;gap:8px"><button class="pill" id="b-st-voice-test" data-i18n="st_voice_test"></button><button class="pill" id="b-st-voice">—</button></div></div>
    <p class="tiny" style="margin:4px 0 8px" data-i18n="st_voice_hint"></p></div>
  <div class="note" style="margin-top:12px" data-i18n="st_hint_long"></div>
  <button class="btn" id="b-st-start" data-i18n="st_start"></button>
  <h2 data-i18n="st_trend"></h2>
  <div id="st-trend"></div>
  <div id="st-list"></div>
  <nav class="tabs" data-tabs></nav>
</section>

<!-- ===== APNEA STATICA: prova ===== -->
<section class="screen" id="s-static-run" style="position:relative;user-select:none;-webkit-user-select:none">
  <div class="sess" id="st-tap">
    <div>
      <div class="phase" id="st-ph"></div>
      <div class="lungs" id="st-sub"></div>
    </div>
    <div class="num" id="st-num">–</div>
    <div style="width:100%;max-width:360px">
      <div class="meta" style="justify-content:center">
        <div><b id="st-m-contr">0</b><span data-i18n="st_contr"></span></div>
        <div><b id="st-m-first">–</b><span data-i18n="st_first"></span></div>
      </div>
      <div class="bar"><i id="st-bar"></i></div>
      <div class="tiny" id="st-hint" style="margin-top:18px;opacity:.9"></div>
      <button class="btn danger" id="b-st-stop" style="margin-top:14px" data-i18n="stop"></button>
    </div>
  </div>
</section>

<!-- ===== APNEA STATICA: risultato ===== -->
<section class="screen" id="s-static-result">
  <h1 id="str-title"></h1>
  <p id="str-sub"></p>
  <div class="stats"><div><b id="str-total">–</b><span data-i18n="st_total"></span></div><div><b id="str-first">–</b><span data-i18n="st_first"></span></div><div><b id="str-contr">0</b><span data-i18n="st_contr"></span></div></div>
  <div class="note ok" id="str-pb" style="display:none;margin-top:8px"></div>
  <h2 data-i18n="st_chart_title"></h2>
  <div id="str-chart"></div>
  <p class="tiny" data-i18n="st_legend"></p>
  <textarea id="str-notes"></textarea>
  <div style="flex:1"></div>
  <button class="btn" id="b-str-save" data-i18n="save"></button>
</section>

<!-- ===== ACCOUNT / LOGIN ===== -->
<section class="screen" id="s-account">
  <div class="top"><h1 id="acc-title"></h1><button class="pill" id="b-acc-back" data-i18n="back"></button></div>
  <div id="acc-guest">

let flushing=false;

/* --- sessioni: locale → cloud --- */
function toRow(r){return {id:r.id,user_id:user.id,device_id:deviceId,protocol_id:r.protocolId,exercise_id:r.exerciseId,schema_version:r.schemaVersion||SCHEMA,
  started_at:r.startedAt,ended_at:r.endedAt,status:r.status,abort_reason:r.abortReason,planned_params:r.plannedParams,actual_params:r.actualParams,
  cycles_completed:r.cyclesCompleted,elapsed_sec:r.elapsedSec,planned_sec:r.plannedSec,feedback:r.feedback,notes:r.notes,next_params:r.nextParams,diag:r.diag}}
function fromRow(x){return {id:x.id,schemaVersion:x.schema_version,protocolId:x.protocol_id,exerciseId:x.exercise_id,startedAt:x.started_at,endedAt:x.ended_at,status:x.status,abortReason:x.abort_reason,
  plannedParams:x.planned_params,actualParams:x.actual_params,cyclesCompleted:x.cycles_completed,elapsedSec:x.elapsed_sec,plannedSec:x.planned_sec,feedback:x.feedback,notes:x.notes,nextParams:x.next_params,diag:x.diag,synced:true,owner:x.user_id}}
let syncing=false;
async function pushSessions(){
  if(syncing||!sb||!user||!navigator.onLine)return;
  const all=lsJ(KEY.sess,[]);const pend=all.filter(r=>!r.synced&&(!r.owner||r.owner===user.id));
  if(!pend.length)return;syncing=true;
  try{
    const {error}=await sb.from('sessions').upsert(pend.map(toRow),{onConflict:'id'});
    if(error)throw error;
    const ids=new Set(pend.map(r=>r.id));all.forEach(r=>{if(ids.has(r.id)){r.synced=true;r.owner=user.id}});lsSet(KEY.sess,JSON.stringify(all));
    log('sessions:pushed',pend.length);
  }catch(e){log('sessions:push-error',e.message)}finally{syncing=false;renderAccountPill()}
}
async function pullSessions(){
  if(!sb||!user||!navigator.onLine)return;
  try{
    const {data,error}=await sb.from('sessions').select('*').order('started_at',{ascending:true}).limit(1000);
    if(error)throw error;
    const all=lsJ(KEY.sess,[]);const byId=new Map(all.map(r=>[r.id,r]));
    let added=0;for(const x of data){if(!byId.has(x.id)){all.push(fromRow(x));added++}else{byId.get(x.id).synced=true;byId.get(x.id).owner=x.user_id}}
    all.sort((a,b)=>a.startedAt<b.startedAt?-1:1);lsSet(KEY.sess,JSON.stringify(all));log('sessions:pulled',{total:data.length,added});
  }catch(e){log('sessions:pull-error',e.message)}
}
async function syncAll(){await flushEvents();await pushSessions()}
window.addEventListener('online',syncAll);

/* ---------- session engine ---------- */
let run=null;
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0)}

async function startSession(){
  $('b-start').disabled=true;
  const tl=buildTimeline(params);
  run={tl,plannedParams:{...params},id:uuid(),startedAt:new Date().toISOString(),lastSeg:-1,url:null,phaseMarks:[]};
  log('session:start',{id:run.id,total:tl.total,params});
  track('session_start',{total:tl.total,params});
  audio.loop=false;audio.onended=null;
  try{audio.src=SILENCE;await withTimeout(audio.play(),1500,'unlock');log('audio:unlocked')}catch(e){log('audio:unlock-failed',e.message)}
  show('s-session');setPhaseUI(null);$('ph').textContent=t('preparing');
  const t0=performance.now();
  try{run.url=await withTimeout(renderTrack(tl),20000,'render');log('track:rendered',{ms:Math.round(performance.now()-t0),sec:tl.total})}
  catch(e){log('track:error',e.message);return abort('render-error')}
  audio.src=run.url;
  try{await withTimeout(audio.play(),5000,'play');run.wallStart=Date.now();log('audio:started')}catch(e){log('audio:play-failed',e.message);return abort('play-error')}
  acquireWake();
  if('mediaSession'in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:'Breathing Coach',artist:t('set_main')});navigator.mediaSession.setActionHandler('pause',()=>{audio.play()});}catch(e){}}
  audio.onended=()=>finish(false);
  tick();
}
function tick(){
  if(!run)return;
  const ct=audio.currentTime,tl=run.tl;
  let idx=tl.segs.findIndex(s=>ct>=s.start&&ct<s.end);
  if(idx!==run.lastSeg){
    run.lastSeg=idx;const s=tl.segs[idx];
    if(s){const wall=(Date.now()-run.wallStart)/1000;const drift=Math.round((wall-ct)*1000);run.phaseMarks.push(drift);log('phase',{b:s.block,t:s.type,rep:s.rep,ct:Math.round(ct*10)/10,driftMs:drift})}
    setPhaseUI(s);
  }
  const s=tl.segs[idx];
  if(s){$('num').textContent=Math.ceil(s.end-ct);$('bar').style.width=((ct-s.start)/(s.end-s.start)*100).toFixed(1)+'%'}
  else if(ct>=tl.total){$('num').textContent='✓'}
  else{$('num').textContent=Math.ceil((tl.segs[0]?.start||0)-ct)}
  $('m-left').textContent=t2(Math.max(0,tl.total-ct));
  run.raf=requestAnimationFrame(tick);
}
function setPhaseUI(s){
  const root=$('s-session');
  if(!s){root.style.background='var(--bg)';root.classList.remove('dark');$('ph').textContent='';$('lg').textContent='';$('m-cycle').textContent='–';$('m-cycle-l').textContent=t('cycle');$('m-left-l').textContent=t('left');return}
  const col=s.block==='warmup'?'var(--ph-warm)':`var(--ph-${s.type})`;
  root.style.background=col;root.classList.add('dark');
  $('ph').textContent=(s.block==='warmup'?t('warm')+' · ':'')+t(s.type);
  $('lg').textContent=s.type==='hold_full'?t('lungs_full'):s.type==='hold_empty'?t('lungs_empty'):'';
  $('m-cycle').textContent=`${s.rep}/${s.reps}`;
  $('m-cycle-l').textContent=s.block==='warmup'?t('warm'):(s.rep===s.reps&&s.reps>1?t('last'):t('cycle'));
  $('m-left-l').textContent=t('left');
}
function completedCycles(){const ct=audio.currentTime;const main=run.tl.segs.filter(s=>s.block==='main');let c=0;for(const s of main){if(ct>=s.end&&s.type==='hold_empty')c=s.rep;else if(ct>=s.end&&params.holdEmpty<=0&&s.type==='exhale')c=s.rep}return c}
function currentPhase(){const ct=audio.currentTime;const s=run.tl.segs.find(s=>ct>=s.start&&ct<s.end);return s?{block:s.block,type:s.type,rep:s.rep}:null}
function abort(reason){log('session:abort',reason);finish(true,reason)}
function finish(aborted,reason){
  if(!run)return;
  cancelAnimationFrame(run.raf);
  const ct=audio.currentTime;
  const cyc=aborted?completedCycles():params.cycles;
  const drifts=run.phaseMarks;const maxDrift=drifts.length?Math.max(...drifts.map(Math.abs)):0;
  run.record={
    id:run.id,schemaVersion:SCHEMA,protocolId:PROTOCOL.id,exerciseId:PROTOCOL.exerciseId,
    startedAt:run.startedAt,endedAt:new Date().toISOString(),
    plannedParams:run.plannedParams,actualParams:run.plannedParams,
    status:aborted?'aborted':'completed',abortReason:aborted?(reason||'user'):null,
    cyclesCompleted:cyc,elapsedSec:Math.round(ct),plannedSec:Math.round(run.tl.total),
    feedback:null,notes:'',nextParams:null,synced:false,owner:user?user.id:null,
    diag:{maxDriftMs:maxDrift,phases:drifts.length,standalone:env().standalone,wake:'wakeLock'in navigator}
  };
  log('session:end',{status:run.record.status,cycles:cyc,elapsed:Math.round(ct),maxDriftMs:maxDrift});
  track(aborted?'session_abort':'session_complete',{reason:aborted?reason:undefined,phase:aborted?currentPhase():undefined,cycles:cyc,elapsed:Math.round(ct),planned:Math.round(run.tl.total)});
  try{audio.pause();audio.onended=null}catch(e){}
  if(run.url)URL.revokeObjectURL(run.url);
  releaseWake();
  $('s-session').style.background='var(--bg)';$('s-session').classList.remove('dark');
  $('fb-title').textContent=aborted?t('abort_title'):t('done_title');
  $('fb-sub').textContent=`${cyc}/${params.cycles} ${t('cycle')} · ${t2(ct)}`;
  document.querySelectorAll('.fb button').forEach(b=>b.classList.remove('sel'));$('fb-notes').value='';fbChoice=null;
  show('s-feedback');$('b-start').disabled=false;
}
let fbChoice=null;
document.querySelectorAll('.fb button').forEach(b=>b.onclick=()=>{fbChoice=b.dataset.v;document.querySelectorAll('.fb button').forEach(x=>x.classList.toggle('sel',x===b))});
$('b-save').onclick=()=>{
  if(!run||!run.record)return show('s-home');
  run.record.feedback=fbChoice;run.record.notes=$('fb-notes').value.trim();
  track('feedback_given',{feedback:fbChoice,hasNotes:!!run.record.notes});
  openNext();
};
$('b-stop').onclick=()=>abort('user');
$('b-start').onclick=()=>startSession().catch(e=>{log('session:crash',e.message);$('b-start').disabled=false;if(run)abort('crash');else show('s-home')});

/* ---------- prossima sessione (proposta ±) ---------- */
let nx={mode:'same',p:null};
const NX_KEYS=['cycles','inhale','holdFull','exhale','holdEmpty'];
function proposal(mode,base){
  const p={...base};const L=PROTOCOL.limits;
  const d=mode==='easier'?-1:mode==='harder'?1:0;
  p.holdFull=clamp(base.holdFull+5*d,L.holdFull);p.holdEmpty=clamp(base.holdEmpty+5*d,L.holdEmpty);
  return p;
}
function clamp(v,[min,max]){return Math.max(min,Math.min(max,v))}
function openNext(){
  const fb=run.record.feedback;nx.mode=fb==='hard'?'easier':fb==='easy'?'harder':'same';
  nx.p=proposal(nx.mode,run.plannedParams);renderNext();show('s-next');
}
function renderNext(){
  document.querySelectorAll('#nx-mode button').forEach(b=>b.classList.toggle('sel',b.dataset.v===nx.mode));
  const labels={cycles:t('set_cycles'),inhale:t('set_in'),holdFull:t('set_hf'),exhale:t('set_out'),holdEmpty:t('set_he')};
  $('nx-steppers').innerHTML=NX_KEYS.map(k=>{const cur=run.plannedParams[k],v=nx.p[k],diff=v-cur;
    return `<div class="row"><div class="lbl">${labels[k]}</div><div class="stepper" data-k="${k}"><button>−</button><span class="v">${v}<small>${diff?(diff>0?'+':'')+diff:'='}</small></span><button>+</button></div></div>`}).join('');
  document.querySelectorAll('#nx-steppers .stepper').forEach(el=>{const k=el.dataset.k,[min,max,step]=PROTOCOL.limits[k];const [m,,p]=el.children;
    m.onclick=()=>{nx.p[k]=clamp(nx.p[k]-step,[min,max]);renderNext()};p.onclick=()=>{nx.p[k]=clamp(nx.p[k]+step,[min,max]);renderNext()}});
  const full={...run.plannedParams,...nx.p};$('nx-total').textContent=T[lang].sum_total(t2(buildTimeline(full).total));
}
document.querySelectorAll('#nx-mode button').forEach(b=>b.onclick=()=>{nx.mode=b.dataset.v;nx.p=proposal(nx.mode,run.plannedParams);renderNext()});
function finalizeSession(nextParams,accepted){
  run.record.nextParams=nextParams;
  const all=lsJ(KEY.sess,[]);all.push(run.record);lsSet(KEY.sess,JSON.stringify(all));
  log('session:saved',run.record.id);track('next_params',{accepted,mode:nx.mode,changed:NX_KEYS.filter(k=>nextParams[k]!==run.plannedParams[k])});
  if(accepted){params={...params,...nextParams};save();track('params_changed',{source:'proposal'})}
  const completed=all.filter(r=>r.status==='completed').length;
  run=null;pushSessions();
  if(isGuest()&&shouldNudge(completed))return openAccount(true);
  goTab('s-home');
}

const fmt=s=>{s=Math.max(0,Math.round(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const fmt1=s=>{const m=Math.floor(s/60),r=s-m*60;return `${m}:${r<10?'0':''}${r.toFixed(1)}`};

/* --- voce --- */
const synth=window.speechSynthesis;
function speak(text){
  if(!stCfg.voice||!synth)return;
  try{synth.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang==='it'?'it-IT':'en-US';u.rate=1;u.pitch=1;u.volume=1;
    const v=synth.getVoices().find(v=>v.lang.replace('_','-').toLowerCase().startsWith(lang==='it'?'it':'en'));if(v)u.voice=v;
    u.onstart=()=>log('voice:start',text);u.onerror=e=>log('voice:error',e.error||'?');synth.speak(u);if(synth.paused)synth.resume()}catch(e){log('voice-error',e.message)}
}
function sayRemaining(s){
  if(s<=10)return speak(String(s));
  const m=Math.floor(s/60),r=s%60;
  if(r===0)return speak(T[lang].v_min(m));
  if(r===30)return m?speak(T[lang].v_min30(m)):speak(t('v_30'));
}
if(synth){try{synth.getVoices()}catch(e){}}

/* --- traccia audio riscaldamento (tono ogni 30 s, tick ultimi 10 s, "via" allo zero) --- */
function renderWarmTrack(W){
  return renderCues(W+2,tr=>{
    for(let s=30;s<W;s+=30)tone(tr,W-s,659,659,.15,.35);
    for(let s=10;s>=4;s--)tone(tr,W-s,880,880,.06,.3);
    for(let s=3;s>=1;s--){tone(tr,W-s,1175,1175,.07,.4);tone(tr,W-s+.14,1175,1175,.07,.4)}
    tone(tr,W,392,784,.7);
  });
}

/* --- motore prova --- */
let srun=null;
async function startStatic(){
  $('b-st-start').disabled=true;
  srun={id:uuid(),startedAt:new Date().toISOString(),phase:'warm',W:stCfg.warmSec,contr:[],lastTap:0,holdStart:null,spoken:new Set(),url:null};
  log('static:start',{id:srun.id,warm:srun.W});track('static_start',{warm:srun.W});
  try{audio.src=SILENCE;await withTimeout(audio.play(),1500,'unlock');tapAudio.src=TAP_WAV;tapAudio.volume=0;await withTimeout(tapAudio.play(),1500,'unlock2').catch(()=>{});tapAudio.volume=1}catch(e){log('audio:unlock-failed',e.message)}
  show('s-static-run');stUI();
  $('st-hint').textContent='';$('b-st-stop').style.display='block';
  if(srun.W>0){
    srun.url=renderWarmTrack(srun.W);audio.src=srun.url;audio.loop=false;
    try{await withTimeout(audio.play(),5000,'play');srun.wallStart=Date.now();log('audio:started')}catch(e){log('audio:play-failed',e.message);return stAbort('play-error')}
    audio.onended=()=>{if(srun&&srun.phase==='warm')stHold()};
    srun.lastS=srun.W;srun.spoken.add(srun.W);
  }else{stHold()}
  acquireWake();stTick();
}
function stHold(){
  if(!srun||srun.phase!=='warm')return;
  srun.phase='hold';srun.holdStart=Date.now();
  // lascia finire il tono di "via", poi silenzio in loop per tenere viva la sessione audio
  audio.onended=()=>{try{audio.src=SILENCE;audio.loop=true;audio.play().catch(()=>{})}catch(e){}};
  if(srun.W===0||audio.ended)audio.onended();
  speak(t('v_go'));log('static:hold-start');
  $('st-hint').textContent=t('st_hint');$('b-st-stop').style.display='none';
  stUI();
}
function stTick(){
  if(!srun)return;
  if(srun.phase==='warm'){
    const el=srun.W>0?audio.currentTime:0;const left=Math.max(0,srun.W-el);const s=Math.ceil(left);
    $('st-num').textContent=fmt(s);$('st-bar').style.width=(srun.W?el/srun.W*100:100).toFixed(1)+'%';
    if(s!==srun.lastS){srun.lastS=s;if(s>0&&(s<=10||s%30===0)&&!srun.spoken.has(s)){srun.spoken.add(s);sayRemaining(s)}}
    if(srun.W>0&&el>=srun.W)stHold();
  }else{
    const h=(Date.now()-srun.holdStart)/1000;
    $('st-num').textContent=fmt(h);const pb=staticPB();$('st-bar').style.width=pb?Math.min(100,h/pb*100).toFixed(1)+'%':'0%';
  }
  srun.raf=requestAnimationFrame(stTick);
}
function stUI(){
  const root=$('s-static-run');root.classList.add('dark');
  if(srun.phase==='warm'){root.style.background='var(--ph-warm)';$('st-ph').textContent=t('st_warm_ph');$('st-sub').textContent=t('st_warm_sub')}
  else{root.style.background='var(--ph-static)';$('st-ph').textContent=t('st_hold_ph');$('st-sub').textContent=t('st_hold_sub')}
  $('st-m-contr').textContent=srun.contr.length;$('st-m-first').textContent=srun.contr.length?fmt(srun.contr[0]):'–';
}
function stTap(){
  if(!srun||srun.phase!=='hold')return;
  const now=Date.now();const h=(now-srun.holdStart)/1000;
  if(now-srun.lastTap<400){srun.contr.pop();srun.lastTap=0;return stFinish(false)}
  srun.lastTap=now;srun.contr.push(Math.round(h*10)/10);
  try{tapAudio.currentTime=0;tapAudio.play().catch(()=>{})}catch(e){}
  if('vibrate'in navigator)navigator.vibrate(30);
  stUI();
}
$('st-tap').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;stTap()});
$('b-st-stop').onclick=()=>stAbort('user');
function stAbort(reason){log('static:abort',reason);stFinish(true,reason)}
function stFinish(aborted,reason){
  if(!srun)return;cancelAnimationFrame(srun.raf);
  const holdSec=srun.phase==='hold'?Math.round((Date.now()-srun.holdStart)/10)/100:0;
  try{audio.pause();audio.loop=false;audio.onended=null;if(synth)synth.cancel()}catch(e){}
  if(srun.url)URL.revokeObjectURL(srun.url);releaseWake();
  if(!aborted&&stCfg.voice)speak(t('v_stop'));
  const pbBefore=staticPB();
  srun.record={
    id:srun.id,schemaVersion:SCHEMA,protocolId:STATIC.id,exerciseId:STATIC.exerciseId,
    startedAt:srun.startedAt,endedAt:new Date().toISOString(),
    plannedParams:{warmSec:srun.W},actualParams:{warmSec:srun.W,holdSec,firstContractionSec:srun.contr[0]??null,contractions:srun.contr},
    status:aborted?'aborted':'completed',abortReason:aborted?(reason||'user'):null,
    cyclesCompleted:srun.contr.length,elapsedSec:Math.round(holdSec),plannedSec:srun.W,
    feedback:null,notes:'',nextParams:null,synced:false,owner:user?user.id:null,diag:{standalone:env().standalone,voice:stCfg.voice}
  };
  log('static:end',{status:srun.record.status,hold:holdSec,contr:srun.contr.length});
  track(aborted?'static_abort':'static_complete',{hold:holdSec,contractions:srun.contr.length,first:srun.contr[0]??null});
  $('s-static-run').style.background='var(--bg)';$('s-static-run').classList.remove('dark');
  $('str-title').textContent=aborted?t('st_aborted'):t('st_done');
  const recs=staticRecords(),last=recs[recs.length-1];

  $('str-total').textContent=fmt1(holdSec);$('str-first').textContent=srun.contr.length?fmt1(srun.contr[0]):'–';$('str-contr').textContent=srun.contr.length;
  const newPB=!aborted&&holdSec>pbBefore&&pbBefore>0;$('str-pb').style.display=newPB?'block':'none';$('str-pb').textContent=newPB?t('st_newpb')+' +'+fmt1(holdSec-pbBefore):'';
  $('str-chart').innerHTML=holdSec>0?attemptChart(holdSec,srun.contr):'';
  $('str-notes').value='';$('str-notes').placeholder=t('notes_ph');
  show('s-static-result');$('b-st-start').disabled=false;
}

/* --- grafici SVG --- */
function attemptChart(total,contr){
  const W=340,H=120,L=8,R=8,top=16,base=78;const x=s=>L+(s/total)*(W-L-R);
  const nb=Math.max(1,Math.ceil(total/10));const buckets=new Array(nb).fill(0);contr.forEach(c=>{buckets[Math.min(nb-1,Math.floor(c/10))]++});const mx=Math.max(1,...buckets);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="aspect-ratio:${W}/${H}">`;
  buckets.forEach((b,i)=>{if(!b)return;const x0=x(i*10),x1=x(Math.min(total,(i+1)*10));const h=(b/mx)*(base-top-4);s+=`<rect x="${x0+1}" y="${base-h}" width="${Math.max(1,x1-x0-2)}" height="${h}" rx="2" fill="rgba(121,201,242,.28)"/>`});
  s+=`<line x1="${L}" y1="${base}" x2="${W-R}" y2="${base}" stroke="rgba(234,244,247,.5)" stroke-width="2"/>`;
  if(contr.length){const f=x(contr[0]);s+=`<rect x="${f}" y="${base-2}" width="${W-R-f}" height="4" fill="var(--ph-hold_full)" opacity=".7"/>`}
  contr.forEach((c,i)=>{s+=`<line x1="${x(c)}" y1="${base-14}" x2="${x(c)}" y2="${base+8}" stroke="${i===0?'var(--ph-hold_full)':'var(--ink)'}" stroke-width="${i===0?2.5:1.5}"/>`});
  const step=total>240?60:30;for(let m=0;m<=total;m+=step)s+=`<text x="${x(m)}" y="${H-6}" text-anchor="${m===0?'start':m+step>total?'end':'middle'}">${fmt(m)}</text>`;
  s+=`<text x="${W-R}" y="${H-6}" text-anchor="end">${fmt(total)}</text>`;
  if(contr.length)s+=`<text x="${Math.min(W-40,x(contr[0]))}" y="${base-20}" fill="var(--ph-hold_full)">${t('st_first')} ${fmt(contr[0])}</text>`;
  return s+'</svg>';
}
function trendChart(recs){
  const W=340,H=140,L=34,R=10,top=14,bot=24;const n=recs.length;const mx=Math.max(...recs.map(r=>r.actualParams.holdSec))*1.08;
  const x=i=>L+(n>1?i/(n-1):0.5)*(W-L-R),y=v=>top+(1-v/mx)*(H-top-bot);
  const hold=recs.map((r,i)=>`${x(i)},${y(r.actualParams.holdSec)}`).join(' ');
  const fc=recs.map((r,i)=>r.actualParams.firstContractionSec!=null?`${x(i)},${y(r.actualParams.firstContractionSec)}`:null).filter(Boolean).join(' ');
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" style="aspect-ratio:${W}/${H}">`;
  for(const v of [mx/3,2*mx/3,mx/1.08]){s+=`<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="rgba(234,244,247,.1)"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end">${fmt(v)}</text>`}
  if(fc)s+=`<polyline points="${fc}" fill="none" stroke="var(--ph-hold_full)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  s+=`<polyline points="${hold}" fill="none" stroke="var(--ph-static)" stroke-width="2.5" stroke-linejoin="round"/>`;
  const pb=Math.max(...recs.map(r=>r.actualParams.holdSec));
  recs.forEach((r,i)=>{const v=r.actualParams.holdSec;s+=`<circle cx="${x(i)}" cy="${y(v)}" r="${v===pb?5:3}" fill="${v===pb?'var(--ph-hold_full)':'var(--ph-static)'}"/>`});
  s+=`<text x="${L}" y="${H-6}">${new Date(recs[0].startedAt).toLocaleDateString(lang)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${new Date(recs[n-1].startedAt).toLocaleDateString(lang)}</text>`;
  s+=`<text x="${W-R}" y="${top-2}" text-anchor="end" fill="var(--ph-static)">${t('st_total')} ─ <tspan fill="var(--ph-hold_full)">${t('st_first')} ┄</tspan></text>`;
  return s+'</svg>';
}

}
document.querySelectorAll('#onb-level button').forEach(b=>b.onclick=()=>{onb.level=b.dataset.v;renderOnb()});
document.querySelectorAll('#onb-goal button').forEach(b=>b.onclick=()=>{onb.goal=b.dataset.v;renderOnb()});
$('b-onb-done').onclick=async()=>{
  onb.display_name=$('onb-name').value.trim();
  if(!user)await ensureUser();
  await saveProfile({...onb,onboarding_done:true,consent_version:PRIVACY_VERSION,consent_at:profile?.consent_at||new Date().toISOString()});
  track('onboarding_done',{level:onb.level,goal:onb.goal,weekly:onb.weekly_target});
  renderAccountPill();goTab('s-welcome');
};

/* ---------- account UI ---------- */
function renderAccountPill(){
  const b=$('b-account');if(!b)return;
  if(isGuest()){b.textContent=t('acc_guest');b.classList.remove('acc')}
  else{const pend=lsJ(KEY.sess,[]).filter(r=>!r.synced).length;b.textContent=(userLabel()||'')+(pend?' · ⟳':' · ✓');b.classList.add('acc')}
  const b2=$('b-account2');if(b2){b2.textContent=isGuest()?t('acc_guest').split(' · ')[0]:(userLabel()||'');b2.classList.toggle('acc',!isGuest())}
}
function renderAccMode(){$('b-acc-mode').textContent=accMode==='new'?t('acc_mode_new'):t('acc_mode_existing')}
function openAccount(nudge){
  accErr('');$('acc-step-email').style.display='block';$('acc-step-code').style.display='none';$('acc-code').value='';
  const guest=isGuest();
  $('acc-title').textContent=nudge?t('nudge_title'):(guest?t('acc_title_guest'):t('acc_title_user'));
  $('acc-guest').style.display=guest?'block':'none';$('acc-user').style.display=guest?'none':'block';
  $('acc-ios-hint').style.display=(isIOS&&env().standalone)?'block':'none';
  accMode='new';renderAccMode();
  if(!guest)renderAccount();
  track('account_screen',{guest,nudge:!!nudge});
  show('s-account');
}
function renderAccount(){
  if(isGuest())return;
  $('acc-name').textContent=T[lang].welcome(userLabel());$('acc-email-shown').textContent=user.email||'';
  const all=lsJ(KEY.sess,[]).filter(r=>r.status==='completed');
  const mins=Math.round(all.reduce((a,r)=>a+(r.elapsedSec||0),0)/60);
  const wk=new Date();wk.setDate(wk.getDate()-wk.getDay()+1);wk.setHours(0,0,0,0);
  $('st-sessions').textContent=all.length;$('st-minutes').textContent=mins;$('st-week').textContent=all.filter(r=>new Date(r.startedAt)>=wk).length;
  $('acc-sync').textContent=T[lang].acc_synced(lsJ(KEY.sess,[]).filter(r=>!r.synced).length);
}
$('b-account').onclick=()=>openAccount(false);
$('b-acc-back').onclick=()=>{if(!profile||!profile.onboarding_done){renderOnb();show('s-onb')}else goTab('s-welcome')};
$('b-have-account').onclick=haveAccount;$('b-have-account2').onclick=haveAccount;
$('b-send-code').onclick=sendCode;
$('b-verify').onclick=verifyCode;
$('acc-code').addEventListener('input',e=>{if(e.target.value.replace(/\D/g,'').length===6)verifyCode()});
$('b-code-back').onclick=()=>{$('acc-step-email').style.display='block';$('acc-step-code').style.display='none';accErr('')};
$('b-google').onclick=googleLogin;
$('b-acc-mode').onclick=()=>{accMode=accMode==='new'?'existing':'new';renderAccMode()};
$('b-logout').onclick=logout;
$('b-export').onclick=()=>{
  const data={exportedAt:new Date().toISOString(),version:VERSION,schemaVersion:SCHEMA,userId:user?user.id:null,deviceId,profile,params,sessions:lsJ(KEY.sess,[])};
  const txt=JSON.stringify(data,null,2);track('export');
  if(navigator.share){navigator.share({title:'Breathing Coach export',text:txt}).catch(()=>{})}
  else{navigator.clipboard?.writeText(txt);alert('JSON copiato / copied')}
};

/* ---------- history ---------- */
$('b-history').onclick=()=>{
  const all=lsJ(KEY.sess,[]).slice().reverse();
  $('hist-list').innerHTML=all.length?all.map(r=>{
    const d=new Date(r.startedAt),p=r.plannedParams||{},fb={easy:'😄',right:'😐',hard:'😣'}[r.feedback]||'·';
    if(r.exerciseId==='static'){const a=r.actualParams||{};return `<div class="hist"><b>${d.toLocaleDateString(lang)} ${d.toLocaleTimeString(lang,{hour:'2-digit',minute:'2-digit'})}</b> ${t('st_title')} — <b>${fmt(a.holdSec||0)}</b> · ${T[lang].st_hist(a.firstContractionSec!=null?fmt(a.firstContractionSec):'',(a.contractions||[]).length)}${r.status==='aborted'?' · '+t('st_aborted').toLowerCase():''}${r.synced?'':' · ⟳'}${r.notes?'<br>'+String(r.notes).replace(/</g,'&lt;'):''}</div>`}
    return `<div class="hist"><b>${d.toLocaleDateString(lang)} ${d.toLocaleTimeString(lang,{hour:'2-digit',minute:'2-digit'})}</b> ${fb} — ${p.inhale}/${p.holdFull}/${p.exhale}/${p.holdEmpty} × ${r.cyclesCompleted}/${p.cycles} · ${t2(r.elapsedSec)}${r.status==='aborted'?' · '+t('abort_title').toLowerCase():''}${r.synced?'':' · ⟳'}${r.notes?'<br>'+String(r.notes).replace(/</g,'&lt;'):''}</div>`
  }).join(''):`<p>${t('hist_empty')}</p>`;
  track('history_view',{count:all.length});
  show('s-history');
};
$('b-hist-back').onclick=()=>goTab('s-welcome');

/* ---------- diag UI ---------- */
$('b-diag').onclick=()=>{$('diag-out').textContent=LOG.join('\n');show('s-diag')};
$('b-diag-back').onclick=()=>goTab('s-welcome');
$('b-copy').onclick=async()=>{const txt=LOG.join('\n');try{await navigator.clipboard.writeText(txt);alert('OK')}catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert('OK')}};
$('b-clear').onclick=()=>{LOG.length=0;log('env',env());$('diag-out').textContent=LOG.join('\n')};

/* ---------- lang / i18n ---------- */
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});
  $('fb-notes').placeholder=t('notes_ph');$('b-lang').textContent=lang==='it'?'EN':'IT';
  $('ver').textContent=`Breathing Coach v${VERSION} · Orbita by Quota Zero`;
  $('b-lang2').textContent=$('b-lang').textContent;
  renderSettings();renderAccountPill();renderAccMode();renderStatic();renderTabs(document.querySelector('.screen.on')?.id||'s-welcome');if($('s-welcome').classList.contains('on'))renderWelcome();
}
$('b-lang').onclick=()=>{lang=lang==='it'?'en':'it';lsSet(KEY.lang,lang);applyLang();if(profile)saveProfile({})};

/* ---------- boot ---------- */
$('b-accept').onclick=async()=>{
  lsSet(KEY.acc,new Date().toISOString());
  profile=Object.assign({},profile||{},{consent_version:PRIVACY_VERSION,consent_at:new Date().toISOString()});lsSet(KEY.onb,JSON.stringify(profile));
  track('consent_accepted',{version:PRIVACY_VERSION});
  renderOnb();show('s-onb');
  await ensureUser();if(user){registerDevice();syncAll()}
};
applyLang();
(async()=>{
  // migrazione record v0.1 (senza flag synced)
  const all=lsJ(KEY.sess,[]);let mig=false;all.forEach(r=>{if(r.synced===undefined){r.synced=false;mig=true}});if(mig)lsSet(KEY.sess,JSON.stringify(all));
  if(!ls(KEY.acc)){show('s-disclaimer')}
  else if(!profile||!profile.onboarding_done){renderOnb();show('s-onb')}
  else goTab('s-welcome');
  if(ls(KEY.acc))await ensureUser(); else {const {data:{session}}=sb?await sb.auth.getSession():{data:{}};if(session)user=session.user}
  if(sb)sb.auth.onAuthStateChange(async(ev,session)=>{log('auth:event',ev);if(session){user=session.user;if((ev==='SIGNED_IN'||ev==='USER_UPDATED')&&!user.is_anonymous){await afterLogin(user.app_metadata?.provider||'oauth')}}});
  track('app_open',{standalone:env().standalone,lang});
  renderAccountPill();
  if(user){registerDevice();if(profile&&profile.onboarding_done)saveProfile({});await pullSessions();await syncAll()}
  renderAccountPill();
})();
</script>
</body>
</html>
