<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Breathing Coach">
<meta name="theme-color" content="#061A2B">
<title>Breathing Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#061A2B; --bg2:#0B2A40; --ink:#EAF4F7; --ink2:#8FB1C2; --line:rgba(234,244,247,.14);
  --accent:#8FE0D2; --danger:#F08A7A;
  --ph-inhale:#8FE0D2; --ph-hold_full:#F2C879; --ph-exhale:#7FB4F0; --ph-hold_empty:#C4A6EA; --ph-warm:#A9D3B5;
  --font:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
:root[data-theme="light"]{--bg:#061A2B;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:400;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:inherit}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.screen{display:none;min-height:100%;flex-direction:column;padding:20px 20px 28px;max-width:520px;margin:0 auto}
.screen.on{display:flex}
h1{font-size:22px;font-weight:600;margin:8px 0 4px;letter-spacing:-.01em}
h2{font-size:17px;font-weight:600;margin:24px 0 10px}
p{line-height:1.55;margin:0 0 12px;color:var(--ink2);font-size:15px}
p.lead{color:var(--ink);font-size:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pill{font-size:13px;color:var(--ink2);border:1px solid var(--line);border-radius:20px;padding:6px 12px}
.btn{display:block;width:100%;padding:16px;border-radius:14px;font-size:17px;font-weight:600;text-align:center;background:var(--accent);color:#04131D;margin-top:10px}
.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn[disabled]{opacity:.45}
.row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);gap:12px}
.row:last-child{border-bottom:0}
.row .lbl{font-size:15px}
.grp{border-left:3px solid var(--c);padding-left:14px;margin-top:6px}
.grp h2{color:var(--c);margin-top:6px}
.grp-warm{--c:var(--ph-warm)}.grp-main{--c:var(--ph-hold_full)}
.mute{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);font-size:20px;display:flex;align-items:center;justify-content:center}
.sess .mute{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;border-color:rgba(4,19,29,.35)}
.row .lbl small{display:block;color:var(--ink2);font-size:12.5px;margin-top:2px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);font-size:20px;line-height:1}
.stepper .v{min-width:56px;text-align:center;font-variant-numeric:tabular-nums;font-size:17px;font-weight:600}
.note{background:var(--bg2);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;color:var(--ink)}
.sum{font-size:14px;color:var(--ink2);margin:6px 0 2px}
/* session */
#s-session{padding:0;transition:background .9s ease}
.sess{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:24px 20px 24px;text-align:center;min-height:100%}
.sess .phase{font-size:26px;font-weight:600;letter-spacing:-.01em;min-height:36px}
.sess .lungs{font-size:15px;opacity:.85;min-height:22px;margin-top:6px}
.sess .num{font-size:min(44vw,200px);font-weight:300;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.04em;margin:8px 0}
.sess .meta{display:flex;gap:28px;font-size:15px;opacity:.85;font-variant-numeric:tabular-nums}
.sess .meta b{display:block;font-size:22px;font-weight:600}
.sess .btn{max-width:360px}
.bar{height:4px;width:100%;background:rgba(0,0,0,.25);border-radius:2px;overflow:hidden;margin-top:18px}
.bar i{display:block;height:100%;background:rgba(255,255,255,.9);width:0%;transition:width .25s linear}
.dark .sess{color:#04131D}
.dark .bar{background:rgba(0,0,0,.15)}
.dark .bar i{background:rgba(4,19,29,.85)}
/* feedback */
.fb{display:flex;gap:10px;margin:6px 0 14px}
.fb button{flex:1;padding:16px 6px;border-radius:14px;border:1px solid var(--line);font-size:15px}
.fb button span{display:block;font-size:30px;margin-bottom:6px}
.fb button.sel{border-color:var(--accent);background:rgba(143,224,210,.12)}
textarea{width:100%;min-height:84px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);padding:12px;resize:vertical}
/* diag */
pre{background:#031019;color:#BFD6E0;font-size:11.5px;line-height:1.45;padding:12px;border-radius:12px;max-height:50vh;overflow:auto;white-space:pre-wrap;word-break:break-word}
.hist{font-size:14px;padding:12px 0;border-bottom:1px solid var(--line);color:var(--ink2)}
.hist b{color:var(--ink);font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(6,26,43,.96);display:none;align-items:flex-end;justify-content:center;padding:20px;z-index:9}
.overlay.on{display:flex}
.sheet{background:var(--bg2);border-radius:18px;padding:20px;max-width:480px;width:100%;max-height:85vh;overflow:auto}
.link{color:var(--accent);text-decoration:underline;background:none;padding:0;font-size:14px}
.tiny{font-size:12.5px;color:var(--ink2)}
@media (prefers-reduced-motion:reduce){#s-session{transition:none}.bar i{transition:none}}
</style>
</head>
<body>

<!-- ===== DISCLAIMER ===== -->
<section class="screen" id="s-disclaimer">
  <h1 data-i18n="dis_title"></h1>
  <p class="lead" data-i18n="dis_1"></p>
  <p data-i18n="dis_2"></p>
  <p data-i18n="dis_3"></p>
  <p data-i18n="dis_4"></p>
  <p class="tiny" data-i18n="dis_5"></p>
  <div style="flex:1"></div>
  <button class="btn" id="b-accept" data-i18n="dis_accept"></button>
</section>

<!-- ===== HOME / SETTINGS ===== -->
<section class="screen" id="s-home">
  <div class="top">
    <div>
      <h1>Breathing Coach</h1>
      <div class="sum" id="proto-name"></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center"><button class="mute" id="b-mute-home">🔊</button><button class="pill" id="b-lang">EN</button></div>
  </div>

  <div class="grp grp-warm"><h2 data-i18n="set_warm"></h2>
  <div class="row"><div class="lbl" data-i18n="set_warm_in"></div><div class="stepper" data-k="warmIn" data-step="1" data-min="2" data-max="20"></div></div>
  <div class="row"><div class="lbl" data-i18n="set_warm_out"></div><div class="stepper" data-k="warmOut" data-step="1" data-min="2" data-max="20"></div></div>
  <div class="row"><div class="lbl" data-i18n="set_warm_n"></div><div class="stepper" data-k="warmReps" data-step="1" data-min="0" data-max="10"></div></div></div>

  <div class="grp grp-main"><h2 data-i18n="set_main"></h2>
  <div class="row"><div class="lbl" data-i18n="set_in"></div><div class="stepper" data-k="inhale" data-step="1" data-min="2" data-max="60"></div></div>
  <div class="row"><div class="lbl" data-i18n="set_hf"></div><div class="stepper" data-k="holdFull" data-step="5" data-min="0" data-max="600"></div></div>
  <div class="row"><div class="lbl" data-i18n="set_out"></div><div class="stepper" data-k="exhale" data-step="1" data-min="2" data-max="60"></div></div>
  <div class="row"><div class="lbl" data-i18n="set_he"></div><div class="stepper" data-k="holdEmpty" data-step="5" data-min="0" data-max="300"></div></div>
  <div class="row"><div class="lbl" data-i18n="set_cycles"></div><div class="stepper" data-k="cycles" data-step="1" data-min="1" data-max="30"></div></div></div>

  <div class="sum" id="sum-total"></div>
  <div class="note" style="margin-top:14px" data-i18n="reminder"></div>

  <button class="btn" id="b-start" data-i18n="start"></button>
  <button class="btn ghost" id="b-testsound" data-i18n="test_sound"></button>
  <div style="display:flex;justify-content:space-between;margin-top:18px">
    <button class="link" id="b-history" data-i18n="history"></button>
    <button class="link" id="b-diag" data-i18n="diag"></button>
  </div>
  <p class="tiny" style="margin-top:22px" id="ver"></p>
</section>

<!-- ===== SESSION ===== -->
<section class="screen" id="s-session" style="position:relative">
  <button class="mute" id="b-mute-sess">🔊</button>
  <div class="sess">
    <div>
      <div class="phase" id="ph"></div>
      <div class="lungs" id="lg"></div>
    </div>
    <div class="num" id="num">–</div>
    <div style="width:100%;max-width:360px">
      <div class="meta" style="justify-content:center">
        <div><b id="m-cycle">–</b><span id="m-cycle-l"></span></div>
        <div><b id="m-left">–</b><span id="m-left-l"></span></div>
      </div>
      <div class="bar"><i id="bar"></i></div>
      <button class="btn danger" id="b-stop" style="margin-top:22px" data-i18n="stop"></button>
    </div>
  </div>
</section>

<!-- ===== FEEDBACK ===== -->
<section class="screen" id="s-feedback">
  <h1 id="fb-title"></h1>
  <p id="fb-sub"></p>
  <h2 data-i18n="fb_q"></h2>
  <div class="fb">
    <button data-v="easy"><span>😄</span><span style="font-size:15px" data-i18n="fb_easy"></span></button>
    <button data-v="right"><span>😐</span><span style="font-size:15px" data-i18n="fb_right"></span></button>
    <button data-v="hard"><span>😣</span><span style="font-size:15px" data-i18n="fb_hard"></span></button>
  </div>
  <textarea id="fb-notes"></textarea>
  <div style="flex:1"></div>
  <button class="btn" id="b-save" data-i18n="save"></button>
</section>

<!-- ===== HISTORY ===== -->
<section class="screen" id="s-history">
  <div class="top"><h1 data-i18n="history"></h1><button class="pill" id="b-hist-back" data-i18n="back"></button></div>
  <div id="hist-list"></div>
  <div style="flex:1"></div>
  <button class="btn ghost" id="b-export" data-i18n="export"></button>
</section>

<!-- ===== DIAGNOSTICS ===== -->
<section class="screen" id="s-diag">
  <div class="top"><h1 data-i18n="diag"></h1><button class="pill" id="b-diag-back" data-i18n="back"></button></div>
  <p class="tiny" data-i18n="diag_help"></p>
  <pre id="diag-out"></pre>
  <button class="btn" id="b-copy" data-i18n="copy"></button>
  <button class="btn ghost" id="b-clear" data-i18n="clear_log"></button>
</section>

<script>
/* ============================================================
   Breathing Coach v0.1 — Orbita / Quota Zero
   Motore: la sessione è resa come UNA traccia audio; il player è l'orologio.
   ============================================================ */
const VERSION='0.1.1';
const SCHEMA=1;
const KEY={cfg:'bc.params.v1',sess:'bc.sessions.v1',acc:'bc.disclaimer.v1',lang:'bc.lang',athlete:'bc.athlete'};

/* ---------- i18n ---------- */
const T={
 it:{
  dis_title:'Prima di iniziare',
  dis_1:'Breathing Coach guida esercizi di respirazione e apnea a secco. Usalo solo seduto o sdraiato, in un luogo sicuro, mai in acqua e mai alla guida.',
  dis_2:'Le apnee a polmoni vuoti possono causare capogiri o perdita di coscienza più rapidamente di quelle a polmoni pieni. Interrompi subito in caso di malessere.',
  dis_3:'Se hai patologie cardiache, respiratorie, neurologiche, o sei in gravidanza, consulta un medico prima di usare l’app. Non sostituisce un istruttore.',
  dis_4:'Proseguendo dichiari di usare l’app sotto la tua esclusiva responsabilità.',
  dis_5:'Versione di test. I dati restano solo su questo dispositivo.',
  dis_accept:'Ho letto e accetto',
  set_warm:'Riscaldamento', set_warm_in:'Inspirazione (s)', set_warm_out:'Espirazione (s)', set_warm_n:'Respiri',
  set_main:'Allenamento', set_in:'Inspirazione (s)', set_hf:'Apnea polmoni pieni (s)', set_out:'Espirazione (s)', set_he:'Apnea polmoni vuoti (s)', set_cycles:'Cicli',
  reminder:'Inspira dal naso. Espira dalla bocca con leggera resistenza.',
  start:'Inizia', test_sound:'Prova i suoni', history:'Storico', diag:'Diagnostica', back:'Indietro', stop:'Interrompi',
  fb_q:'Com’è andata?', fb_easy:'Facile', fb_right:'Giusta', fb_hard:'Difficile', save:'Salva', notes_ph:'Note (facoltative)',
  export:'Esporta dati (JSON)', copy:'Copia log', clear_log:'Svuota log', diag_help:'Fai una sessione, poi copia questo log e incollalo in chat.',
  preparing:'Preparazione…', warm:'Riscaldamento', inhale:'Inspira', exhale:'Espira', hold_full:'Trattieni', hold_empty:'Trattieni',
  lungs_full:'Polmoni pieni', lungs_empty:'Polmoni vuoti', cycle:'ciclo', left:'rimanente', last:'ultimo ciclo',
  done_title:'Allenamento completato', abort_title:'Allenamento interrotto',
  done_sub:(c,t)=>`${c} cicli su ${t}, ${t2(t*1)}`, sum_total:(m)=>`Durata totale ${m}`,
  hist_empty:'Nessuna sessione ancora. La prima la fai oggi.',
  sound_hint:'Ascolta: inspira, trattieni (pieni), espira, trattieni (vuoti), ultimo ciclo, fine.',
  proto:'Training respiratorio 4 fasi',
 },
 en:{
  dis_title:'Before you start',
  dis_1:'Breathing Coach guides dry breathing and breath-hold exercises. Use it only seated or lying down, in a safe place, never in water and never while driving.',
  dis_2:'Empty-lung holds can cause dizziness or loss of consciousness sooner than full-lung holds. Stop immediately if you feel unwell.',
  dis_3:'If you have heart, respiratory or neurological conditions, or are pregnant, ask a doctor before using the app. It does not replace an instructor.',
  dis_4:'By continuing you agree to use the app at your own risk.',
  dis_5:'Test version. Data stays on this device only.',
  dis_accept:'I have read and accept',
  set_warm:'Warm-up', set_warm_in:'Inhale (s)', set_warm_out:'Exhale (s)', set_warm_n:'Breaths',
  set_main:'Training', set_in:'Inhale (s)', set_hf:'Full-lung hold (s)', set_out:'Exhale (s)', set_he:'Empty-lung hold (s)', set_cycles:'Cycles',
  reminder:'Inhale through the nose. Exhale through the mouth with slight resistance.',
  start:'Start', test_sound:'Test sounds', history:'History', diag:'Diagnostics', back:'Back', stop:'Stop',
  fb_q:'How was it?', fb_easy:'Easy', fb_right:'Right', fb_hard:'Hard', save:'Save', notes_ph:'Notes (optional)',
  export:'Export data (JSON)', copy:'Copy log', clear_log:'Clear log', diag_help:'Do a session, then copy this log and paste it in chat.',
  preparing:'Preparing…', warm:'Warm-up', inhale:'Inhale', exhale:'Exhale', hold_full:'Hold', hold_empty:'Hold',
  lungs_full:'Full lungs', lungs_empty:'Empty lungs', cycle:'cycle', left:'left', last:'last cycle',
  done_title:'Training complete', abort_title:'Training stopped',
  done_sub:(c,t)=>`${c} of ${t} cycles`, sum_total:(m)=>`Total duration ${m}`,
  hist_empty:'No sessions yet. The first one is today.',
  sound_hint:'Listen: inhale, hold (full), exhale, hold (empty), last cycle, end.',
  proto:'4-phase breathing training',
 }
};
let lang=ls(KEY.lang)||'it';
const t=k=>T[lang][k]??k;
function t2(s){s=Math.round(s);const m=Math.floor(s/60),r=s%60;return m?`${m} min ${String(r).padStart(2,'0')} s`:`${r} s`}

/* ---------- storage (best effort) ---------- */
function ls(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){log('storage-error',e.message);return false}}
function uuid(){return crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c=='x'?r:(r&3|8)).toString(16)})}
let athleteId=ls(KEY.athlete);if(!athleteId){athleteId=uuid();lsSet(KEY.athlete,athleteId)}

/* ---------- protocol (dati, non codice) ---------- */
const PROTOCOL={
  id:'breathing-4phase-training', exerciseId:'breathing', nameKey:'proto', schemaVersion:SCHEMA,
  params:{warmIn:6,warmOut:6,warmReps:5,inhale:10,holdFull:20,exhale:10,holdEmpty:10,cycles:6},
  blocks:[
    {kind:'warmup',repeat:'warmReps',phases:[
      {type:'inhale',duration:{param:'warmIn'},cue:'inhale'},
      {type:'exhale',duration:{param:'warmOut'},cue:'exhale'}]},
    {kind:'main',repeat:'cycles',phases:[
      {type:'inhale',duration:{param:'inhale'},cue:'inhale'},
      {type:'hold_full',duration:{param:'holdFull'},cue:'hold_full'},
      {type:'exhale',duration:{param:'exhale'},cue:'exhale'},
      {type:'hold_empty',duration:{param:'holdEmpty'},cue:'hold_empty'}]}
  ]
};
let params=Object.assign({},PROTOCOL.params,JSON.parse(ls(KEY.cfg)||'{}'));

/* Timeline: elenco di segmenti con inizio/fine assoluti in secondi */
function buildTimeline(p){
  const segs=[];let tt=0;const LEAD=2; // 2 s di preparazione prima del primo segnale
  tt+=LEAD;
  for(const b of PROTOCOL.blocks){
    const reps=p[b.repeat];
    for(let r=1;r<=reps;r++){
      for(const ph of b.phases){
        const d=p[ph.duration.param];if(d<=0)continue;
        segs.push({block:b.kind,type:ph.type,cue:ph.cue,rep:r,reps,start:tt,end:tt+d});
        tt+=d;
      }
    }
  }
  return {segs,total:tt};
}

/* ---------- audio: rendering della traccia ---------- */
const SR=16000;
function tone(ctx,dest,t0,f0,f1,dur,gain=.6,type='sine'){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t0);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(gain,t0+.02);g.gain.setValueAtTime(gain,t0+dur-.06);g.gain.linearRampToValueAtTime(0,t0+dur);
  o.connect(g).connect(dest);o.start(t0);o.stop(t0+dur+.01);
}
/* Segnali: distinti per forma, non solo per altezza */
const CUES={
  inhale:(c,d,t)=>tone(c,d,t,392,784,.7),                                  // salita
  exhale:(c,d,t)=>tone(c,d,t,784,392,.7),                                  // discesa
  hold_full:(c,d,t)=>{tone(c,d,t,880,880,.18);tone(c,d,t+.26,880,880,.18)}, // 2 beep acuti
  hold_empty:(c,d,t)=>tone(c,d,t,262,262,.5,.7,'triangle'),                // 1 nota bassa lunga
  last:(c,d,t)=>{for(let i=0;i<3;i++)tone(c,d,t+i*.22,1047,1047,.12,.5)},  // 3 beep: ultimo ciclo
  end:(c,d,t)=>{tone(c,d,t,523,523,1.2,.4);tone(c,d,t,659,659,1.2,.35);tone(c,d,t,784,784,1.2,.3)}, // accordo
  warm:(c,d,t)=>tone(c,d,t,523,523,.25,.4),
};
async function renderTrack(tl){
  const len=Math.ceil((tl.total+3)*SR);
  const ctx=new OfflineAudioContext(1,len,SR);
  const dest=ctx.destination;
  for(const s of tl.segs){
    if(s.block==='warmup'){ if(s.type==='inhale') CUES.inhale(ctx,dest,s.start); else CUES.exhale(ctx,dest,s.start); }
    else{
      CUES[s.cue](ctx,dest,s.start);
      if(s.type==='inhale'&&s.rep===s.reps&&s.reps>1) CUES.last(ctx,dest,s.start+1.0);
    }
  }
  CUES.end(ctx,dest,tl.total);
  const buf=await ctx.startRendering();
  return URL.createObjectURL(wavBlob(buf));
}
function wavBlob(buf){
  const ch=buf.getChannelData(0),n=ch.length,ab=new ArrayBuffer(44+n*2),v=new DataView(ab);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,SR,true);v.setUint32(28,SR*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const s=Math.max(-1,Math.min(1,ch[i]));v.setInt16(44+i*2,s<0?s*32768:s*32767,true)}
  return new Blob([ab],{type:'audio/wav'});
}
/* silenzio brevissimo per sbloccare l'audio dentro il tap */
const SILENCE='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=';
const audio=new Audio();audio.setAttribute('playsinline','');audio.preload='auto';

/* ---------- diagnostics ---------- */
const LOG=[];
function log(ev,d){const line=`${new Date().toISOString().slice(11,23)} ${ev}${d!==undefined?' '+(typeof d==='string'?d:JSON.stringify(d)):''}`;LOG.push(line);if(LOG.length>400)LOG.shift();const o=document.getElementById('diag-out');if(o&&document.getElementById('s-diag').classList.contains('on'))o.textContent=LOG.join('\n')}
function env(){const n=navigator;return {ua:n.userAgent,standalone:!!n.standalone||matchMedia('(display-mode: standalone)').matches,wakeLock:'wakeLock'in n,vibrate:'vibrate'in n,mediaSession:'mediaSession'in n,offlineAudio:'OfflineAudioContext'in window,screen:`${screen.width}x${screen.height}`,version:VERSION}}
log('env',env());
document.addEventListener('visibilitychange',()=>{log('visibility',document.visibilityState);if(document.visibilityState==='visible'&&run)acquireWake()});
['play','playing','pause','ended','stalled','suspend','waiting','error','seeking'].forEach(e=>audio.addEventListener(e,()=>log('audio:'+e,e==='error'&&audio.error?audio.error.code:Math.round(audio.currentTime*100)/100)));

/* ---------- wake lock ---------- */
let wake=null;
async function acquireWake(){try{if(!('wakeLock'in navigator))return log('wake','unsupported');wake=await navigator.wakeLock.request('screen');log('wake','acquired');wake.addEventListener('release',()=>log('wake','released'))}catch(e){log('wake-error',e.message)}}
async function releaseWake(){try{if(wake){await wake.release();wake=null}}catch(e){}}

/* ---------- session engine ---------- */
let run=null; // {tl, plannedParams, startedAt, wallStart, raf, lastSeg, url}
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0)}

async function startSession(){
  $('b-start').disabled=true;
  const tl=buildTimeline(params);
  run={tl,plannedParams:{...params},id:uuid(),startedAt:new Date().toISOString(),lastSeg:-1,url:null,phaseMarks:[]};
  log('session:start',{id:run.id,total:tl.total,params});
  // 1) sblocco audio nel gesto
  try{audio.src=SILENCE;await audio.play();log('audio:unlocked')}catch(e){log('audio:unlock-failed',e.message)}
  show('s-session');setPhaseUI(null);$('ph').textContent=t('preparing');
  // 2) rendering traccia
  const t0=performance.now();
  try{run.url=await renderTrack(tl);log('track:rendered',{ms:Math.round(performance.now()-t0),sec:tl.total})}
  catch(e){log('track:error',e.message);return abort('render-error')}
  // 3) play
  audio.src=run.url;
  try{await audio.play();run.wallStart=Date.now();log('audio:started')}catch(e){log('audio:play-failed',e.message);return abort('play-error')}
  acquireWake();
  if('mediaSession'in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:'Breathing Coach',artist:t('set_main')});navigator.mediaSession.setActionHandler('pause',()=>{audio.play()});}catch(e){}}
  audio.onended=()=>finish(false);
  tick();
}
function tick(){
  if(!run)return;
  const ct=audio.currentTime,tl=run.tl;
  let idx=tl.segs.findIndex(s=>ct>=s.start&&ct<s.end);
  if(idx!==run.lastSeg){
    run.lastSeg=idx;const s=tl.segs[idx];
    if(s){const wall=(Date.now()-run.wallStart)/1000;const drift=Math.round((wall-ct)*1000);run.phaseMarks.push(drift);log('phase',{b:s.block,t:s.type,rep:s.rep,ct:Math.round(ct*10)/10,driftMs:drift})}
    setPhaseUI(s);
  }
  const s=tl.segs[idx];
  if(s){$('num').textContent=Math.ceil(s.end-ct);$('bar').style.width=((ct-s.start)/(s.end-s.start)*100).toFixed(1)+'%'}
  else if(ct>=tl.total){$('num').textContent='✓'}
  else{$('num').textContent=Math.ceil((tl.segs[0]?.start||0)-ct)}
  $('m-left').textContent=t2(Math.max(0,tl.total-ct));
  run.raf=requestAnimationFrame(tick);
}
function setPhaseUI(s){
  const root=$('s-session');
  if(!s){root.style.background='var(--bg)';root.classList.remove('dark');$('ph').textContent='';$('lg').textContent='';$('m-cycle').textContent='–';$('m-cycle-l').textContent=t('cycle');$('m-left-l').textContent=t('left');return}
  const col=s.block==='warmup'?'var(--ph-warm)':`var(--ph-${s.type})`;
  root.style.background=col;root.classList.add('dark');
  $('ph').textContent=(s.block==='warmup'?t('warm')+' · ':'')+t(s.type);
  $('lg').textContent=s.type==='hold_full'?t('lungs_full'):s.type==='hold_empty'?t('lungs_empty'):'';
  $('m-cycle').textContent=s.block==='warmup'?`${s.rep}/${s.reps}`:`${s.rep}/${s.reps}`;
  $('m-cycle-l').textContent=s.block==='warmup'?t('warm'):(s.rep===s.reps&&s.reps>1?t('last'):t('cycle'));
  $('m-left-l').textContent=t('left');
}
function completedCycles(){const ct=audio.currentTime;const main=run.tl.segs.filter(s=>s.block==='main');let c=0;for(const s of main){if(ct>=s.end&&s.type==='hold_empty')c=s.rep;else if(ct>=s.end&&params.holdEmpty<=0&&s.type==='exhale')c=s.rep}return c}
function abort(reason){log('session:abort',reason);finish(true,reason)}
function finish(aborted,reason){
  if(!run)return;
  cancelAnimationFrame(run.raf);
  const ct=audio.currentTime;
  const cyc=aborted?completedCycles():params.cycles;
  const drifts=run.phaseMarks;const maxDrift=drifts.length?Math.max(...drifts.map(Math.abs)):0;
  run.record={
    id:run.id,schemaVersion:SCHEMA,athleteId,protocolId:PROTOCOL.id,exerciseId:PROTOCOL.exerciseId,
    startedAt:run.startedAt,endedAt:new Date().toISOString(),
    plannedParams:run.plannedParams,actualParams:run.plannedParams,
    status:aborted?'aborted':'completed',abortReason:aborted?(reason||'user'):null,
    cyclesCompleted:cyc,elapsedSec:Math.round(ct),plannedSec:Math.round(run.tl.total),
    feedback:null,notes:'',nextParams:null,
    diag:{maxDriftMs:maxDrift,phases:drifts.length,standalone:env().standalone,wake:'wakeLock'in navigator}
  };
  log('session:end',{status:run.record.status,cycles:cyc,elapsed:Math.round(ct),maxDriftMs:maxDrift});
  try{audio.pause();audio.onended=null}catch(e){}
  if(run.url)URL.revokeObjectURL(run.url);
  releaseWake();
  $('s-session').style.background='var(--bg)';$('s-session').classList.remove('dark');
  $('fb-title').textContent=aborted?t('abort_title'):t('done_title');
  $('fb-sub').textContent=`${cyc}/${params.cycles} ${t('cycle')} · ${t2(ct)}`;
  document.querySelectorAll('.fb button').forEach(b=>b.classList.remove('sel'));$('fb-notes').value='';fbChoice=null;
  show('s-feedback');$('b-start').disabled=false;
}
let fbChoice=null;
document.querySelectorAll('.fb button').forEach(b=>b.onclick=()=>{fbChoice=b.dataset.v;document.querySelectorAll('.fb button').forEach(x=>x.classList.toggle('sel',x===b))});
$('b-save').onclick=()=>{
  if(!run||!run.record)return show('s-home');
  run.record.feedback=fbChoice;run.record.notes=$('fb-notes').value.trim();
  run.record.nextParams={...params}; // v0.2: proposta ±
  const all=JSON.parse(ls(KEY.sess)||'[]');all.push(run.record);lsSet(KEY.sess,JSON.stringify(all));
  log('session:saved',run.record.id);run=null;show('s-home');
};
$('b-stop').onclick=()=>abort('user');
$('b-start').onclick=startSession;

/* ---------- mute ---------- */
let muted=ls('bc.muted')==='1';
function applyMute(){audio.muted=muted;document.querySelectorAll('.mute').forEach(b=>b.textContent=muted?'🔇':'🔊')}
document.querySelectorAll('.mute').forEach(b=>b.onclick=()=>{muted=!muted;lsSet('bc.muted',muted?'1':'0');applyMute();log('mute',muted)});
applyMute();

/* ---------- test suoni ---------- */
$('b-testsound').onclick=async()=>{
  try{audio.src=SILENCE;await audio.play()}catch(e){log('audio:unlock-failed',e.message)}
  const ctx=new OfflineAudioContext(1,SR*9,SR),d=ctx.destination;
  CUES.inhale(ctx,d,.5);CUES.hold_full(ctx,d,2);CUES.exhale(ctx,d,3.5);CUES.hold_empty(ctx,d,5);CUES.last(ctx,d,6.5);CUES.end(ctx,d,7.5);
  const buf=await ctx.startRendering();audio.src=URL.createObjectURL(wavBlob(buf));
  try{await audio.play();log('test-sound:play')}catch(e){log('test-sound:failed',e.message)}
  alert(t('sound_hint'));
};

/* ---------- settings UI ---------- */
function renderSettings(){
  document.querySelectorAll('.stepper').forEach(el=>{
    const k=el.dataset.k,step=+el.dataset.step,min=+el.dataset.min,max=+el.dataset.max;
    el.innerHTML=`<button aria-label="-">−</button><span class="v">${params[k]}</span><button aria-label="+">+</button>`;
    const [m,,p]=el.children;
    m.onclick=()=>{params[k]=Math.max(min,params[k]-step);save()};
    p.onclick=()=>{params[k]=Math.min(max,params[k]+step);save()};
  });
  const tl=buildTimeline(params);
  $('sum-total').textContent=T[lang].sum_total(t2(tl.total));
  $('proto-name').textContent=t('proto');
}
function save(){lsSet(KEY.cfg,JSON.stringify(params));renderSettings()}

/* ---------- history ---------- */
$('b-history').onclick=()=>{
  const all=JSON.parse(ls(KEY.sess)||'[]').slice().reverse();
  $('hist-list').innerHTML=all.length?all.map(r=>{
    const d=new Date(r.startedAt),p=r.plannedParams,fb={easy:'😄',right:'😐',hard:'😣'}[r.feedback]||'·';
    return `<div class="hist"><b>${d.toLocaleDateString(lang)} ${d.toLocaleTimeString(lang,{hour:'2-digit',minute:'2-digit'})}</b> ${fb} — ${p.inhale}/${p.holdFull}/${p.exhale}/${p.holdEmpty} × ${r.cyclesCompleted}/${p.cycles} · ${t2(r.elapsedSec)}${r.status==='aborted'?' · '+t('abort_title').toLowerCase():''}${r.notes?'<br>'+r.notes.replace(/</g,'&lt;'):''}</div>`
  }).join(''):`<p>${t('hist_empty')}</p>`;
  show('s-history');
};
$('b-hist-back').onclick=()=>show('s-home');
$('b-export').onclick=()=>{
  const data={exportedAt:new Date().toISOString(),version:VERSION,schemaVersion:SCHEMA,athleteId,params,sessions:JSON.parse(ls(KEY.sess)||'[]')};
  const txt=JSON.stringify(data,null,2);
  if(navigator.share){navigator.share({title:'Breathing Coach export',text:txt}).catch(()=>{})}
  else{navigator.clipboard?.writeText(txt);alert('JSON copiato / copied')}
};

/* ---------- diag UI ---------- */
$('b-diag').onclick=()=>{$('diag-out').textContent=LOG.join('\n');show('s-diag')};
$('b-diag-back').onclick=()=>show('s-home');
$('b-copy').onclick=async()=>{const txt=LOG.join('\n');try{await navigator.clipboard.writeText(txt);alert('OK')}catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert('OK')}};
$('b-clear').onclick=()=>{LOG.length=0;log('env',env());$('diag-out').textContent=LOG.join('\n')};

/* ---------- lang / i18n ---------- */
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});
  $('fb-notes').placeholder=t('notes_ph');$('b-lang').textContent=lang==='it'?'EN':'IT';
  $('ver').textContent=`Breathing Coach v${VERSION} · Orbita by Quota Zero`;
  renderSettings();
}
$('b-lang').onclick=()=>{lang=lang==='it'?'en':'it';lsSet(KEY.lang,lang);applyLang()};

/* ---------- boot ---------- */
$('b-accept').onclick=()=>{lsSet(KEY.acc,new Date().toISOString());show('s-home')};
applyLang();
show(ls(KEY.acc)?'s-home':'s-disclaimer');
</script>
</body>
